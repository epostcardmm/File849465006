<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Question Page</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pyidaungsu', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #fbc2eb 0%, #a6c1ee 100%);
      overflow: hidden;
      position: relative;
    }

    .container {
      background: rgba(255, 255, 255, 0.95);
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      text-align: center;
      max-width: 440px;
      width: 92%;
      z-index: 10;
      transition: all 0.4s ease;
    }

    .gif-container img {
      width: 160px;
      height: 160px;
      object-fit: cover;
      border-radius: 15px;
      margin-bottom: 15px;
    }

    h1 {
      font-size: 20px;
      color: #333;
      margin-bottom: 20px;
      line-height: 1.5;
    }

    .btn-group {
      display: flex;
      justify-content: center;
      gap: 20px;
      position: relative;
    }

    button {
      padding: 12px 28px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: transform 0.2s, background-color 0.2s;
    }

    .btn-yes {
      background-color: #ff4b2b;
      color: white;
      box-shadow: 0 4px 15px rgba(255, 75, 43, 0.4);
    }

    .btn-yes:hover {
      background-color: #ff416c;
      transform: scale(1.05);
    }

    .btn-no {
      background-color: #e0e0e0;
      color: #333;
      position: relative;
      transition: all 0.2s ease-out;
    }

    .btn-card {
      background: linear-gradient(45deg, #2b5876, #4e4376);
      color: white;
      margin-top: 15px;
      box-shadow: 0 4px 15px rgba(43, 88, 118, 0.4);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }

    /* --- Realistic Envelope Design (Expanded for Longer Text) --- */
    .envelope-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-top: 10px;
      cursor: pointer;
      min-height: 380px;
      position: relative;
    }

    .envelope {
      position: relative;
      width: 320px;
      height: 200px;
      background: #c23945;
      border-radius: 6px;
      box-shadow: 0 12px 25px rgba(0, 0, 0, 0.2);
    }

    .letter {
      position: absolute;
      top: 10px;
      left: 15px;
      width: 290px;
      height: 170px;
      background: #fffdf9;
      border-radius: 6px;
      padding: 15px;
      text-align: left;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
      transition: transform 0.6s ease-in-out, height 0.6s ease-in-out, z-index 0.3s, opacity 0.3s;
      z-index: 2;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 1px solid #eae2d6;
      opacity: 0;
      pointer-events: none;
      overflow-y: auto; /* စာရှည်ရင် အောက်ကို scroll ဆွဲလို့ရအောင် လုပ်ပေးထားပါတယ် */
    }

    .envelope::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      border-top: 100px solid transparent;
      border-bottom: 100px solid transparent;
      border-left: 160px solid #d94350;
      border-bottom-left-radius: 6px;
      border-top-left-radius: 6px;
      z-index: 3;
    }

    .envelope::after {
      content: '';
      position: absolute;
      top: 0;
      right: 0;
      width: 0;
      height: 0;
      border-top: 100px solid transparent;
      border-bottom: 100px solid transparent;
      border-right: 160px solid #d94350;
      border-bottom-right-radius: 6px;
      border-top-right-radius: 6px;
      z-index: 3;
    }

    .envelope-pocket {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: 160px solid transparent;
      border-right: 160px solid transparent;
      border-bottom: 110px solid #e64a58;
      border-bottom-left-radius: 6px;
      border-bottom-right-radius: 6px;
      z-index: 4;
    }

    .envelope-flap {
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: 160px solid transparent;
      border-right: 160px solid transparent;
      border-top: 115px solid #e64a58;
      transform-origin: top;
      transition: transform 0.6s ease-in-out, z-index 0.2s;
      z-index: 5;
      filter: drop-shadow(0 2px 3px rgba(0,0,0,0.15));
    }

    .letter p {
      font-size: 13px;
      color: #333;
      line-height: 1.6;
    }

    .mini-btn-group {
      display: flex;
      justify-content: space-around;
      margin-top: 12px;
      padding-top: 8px;
      border-top: 1px dashed #ccc;
      flex-shrink: 0;
    }

    .mini-btn {
      padding: 6px 16px;
      font-size: 11px;
      border-radius: 15px;
      border: none;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .mini-btn-yes {
      background-color: #2ecc71;
      color: white;
    }

    .mini-btn-no {
      background-color: #e74c3c;
      color: white;
    }

    /* Open State Animations (Taller Letter Box) */
    .envelope.open .envelope-flap {
      transform: rotateX(180deg);
      z-index: 1;
    }

    .envelope.open .letter {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(-165px);
      height: 330px; /* ဖွင့်လိုက်တဲ့အခါ စာရွက် အရှည်ကြီးပေါ်လာအောင် လုပ်ထားပါတယ် */
      z-index: 6;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
    }

    .instruction-text {
      font-size: 13px;
      color: #555;
      margin-top: 10px;
      font-style: italic;
    }

    .warning-popup {
      position: absolute;
      padding: 10px 18px;
      background-color: #ff3366;
      color: white;
      font-size: 14px;
      font-weight: bold;
      border-radius: 20px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
      pointer-events: none;
      animation: popup 1.5s ease-out forwards;
      z-index: 100;
    }

    @keyframes popup {
      0% { opacity: 0; transform: translateY(0) scale(0.8); }
      20% { opacity: 1; transform: translateY(-10px) scale(1.1); }
      80% { opacity: 1; }
      100% { opacity: 0; transform: translateY(-30px) scale(1); }
    }
  </style>
</head>
<body>

  <div class="container" id="mainContainer">
    <div class="gif-container">
      <img id="gifImage" src="https://media0.giphy.com/media/v1.Y2lkPTc5MGI3NjExbWhsN2dmbWd3aG9xcGl2M2QwempsbDJyMnFsOHZsMnoweTFkNnQzcSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/Hx3S5ELfCXme8OqfL2/giphy.gif" alt="Cute Gif">
    </div>
    
    <h1 id="questionText">ပြန်လာပေးပါလား... 🥺</h1>

    <div class="btn-group">
      <button class="btn-yes" id="yesBtn" onclick="handleYes()">YES</button>
      <button class="btn-no" id="noBtn" onclick="handleNo()">NO</button>
    </div>
  </div>

  <script>
    const warnings = [
      "တကယ် လုံးဝ မလာတော့ဘူးလား? 🥺",
      "သေချာ စဉ်းစားပါဦး... 💔",
      "No ကို မနှိပ်ပါနဲ့တော့နော်! 😭",
      "စိတ်ဆိုးပြေပါတော့နော်... 🙏",
      "ပြန်လာခဲ့ပါနော်... ✨",
      "မနှိပ်ပါနဲ့တော့ ဆိုမှ... 🙈"
    ];

    let warningIndex = 0;
    let yesScale = 1;

    function handleNo() {
      const noBtn = document.getElementById('noBtn');
      const yesBtn = document.getElementById('yesBtn');

      const maxX = window.innerWidth - noBtn.offsetWidth - 20;
      const maxY = window.innerHeight - noBtn.offsetHeight - 20;

      const randomX = Math.max(10, Math.floor(Math.random() * maxX));
      const randomY = Math.max(10, Math.floor(Math.random() * maxY));

      noBtn.style.position = 'fixed';
      noBtn.style.left = `${randomX}px`;
      noBtn.style.top = `${randomY}px`;

      yesScale += 0.15;
      yesBtn.style.transform = `scale(${yesScale})`;

      showWarning(randomX, randomY);
    }

    function showWarning(x, y) {
      const warning = document.createElement('div');
      warning.className = 'warning-popup';
      warning.innerText = warnings[warningIndex % warnings.length];
      warningIndex++;

      warning.style.left = `${Math.min(window.innerWidth - 180, x)}px`;
      warning.style.top = `${Math.max(10, y - 40)}px`;

      document.body.appendChild(warning);

      setTimeout(() => {
        warning.remove();
      }, 1500);
    }

    function handleYes() {
      const container = document.getElementById('mainContainer');
      
      container.innerHTML = `
        <div class="gif-container">
          <img src="https://media2.giphy.com/media/v1.Y2lkPTc5MGI3NjExZTU0dmJnOTl2dnhvNGZva216bDRzYjJ6czljemZuYXBlZjN0bWY3YiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/QO6gybBh0d4LLTNn1d/giphy.gif" alt="Happy Gif">
        </div>
        <h1>Yay! ပြန်လာပေးလို့ ကျေးဇူးပါ! ❤️</h1>
        <button class="btn-card" onclick="goToEpostcardPage()">E-postcard For You ✉️</button>
      `;
    }

    function goToEpostcardPage() {
      const container = document.getElementById('mainContainer');
      
      container.innerHTML = `
        <h1 style="margin-bottom: 10px; color: #2c5364;">💌 Special Message For You</h1>
        <div class="envelope-container">
          <div class="envelope" id="envelope" onclick="toggleEnvelope()">
            <div class="envelope-flap"></div>
            <div class="envelope-pocket"></div>
            <div class="letter">
              <div>
                <p><b>တောင်းပန်စာလေးပါ... ✨</b><br><br>
                ငါ့ဘက်က မှားသွားတာတွေအတွက် အများကြီး တောင်းပန်ပါတယ်။ <br><br>
                စိတ်ဆိုးပြေပြီး အရင်လို ပြန်ဖြစ်ကြရအောင်နော်... ❤️</p>
              </div>
              
              <div class="mini-btn-group" id="responseArea">
              </div>
            </div>
          </div>
        </div>
        <p class="instruction-text" id="instructText">👆 စာအိတ်လေးကို နှိပ်ပြီး စာထုတ်ဖတ်ပါ</p>
      `;
    }

    function toggleEnvelope() {
      const envelope = document.getElementById('envelope');
      const instructText = document.getElementById('instructText');
      
      envelope.classList.toggle('open');
      
      if (envelope.classList.contains('open')) {
        instructText.innerText = "အဖြေတစ်ခုခုကို ရွေးပေးပါနော် ✨";
      } else {
        instructText.innerText = "👆 စာအိတ်လေးကို နှိပ်ပြီး စာထုတ်ဖတ်ပါ";
      }
    }

    function sendResponse(event, answer) {
      event.stopPropagation();
      
      const responseArea = document.getElementById('responseArea');
      responseArea.innerHTML = `<span style="font-size:11px; color:#2c5364; font-weight:bold;">အဖြေပို့နေပါသည်။...</span>`;

      fetch("", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Accept": "application/json"
        },
        body: JSON.stringify({
          Response: answer,
          Timestamp: new Date().toLocaleString()
        })
      })
      .then(response => {
        responseArea.innerHTML = `<span style="font-size:11px; color:#2ecc71; font-weight:bold;">အဖြေကို ပို့ပေးလိုက်ပါပြီ! ✨</span>`;
      })
      .catch(error => {
        responseArea.innerHTML = `<span style="font-size:11px; color:#2ecc71; font-weight:bold;">အဖြေကို ပို့ပေးလိုက်ပါပြီ! ✨</span>`;
      });
    }
  </script>
</body>
</html>
